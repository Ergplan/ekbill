# EkBill v2 on the shared tariff-order VM.  Compose project name: ekbill2 (always pass -p ekbill2).
#
#   deploy/vm/up.sh        -- reads secrets from Secret Manager into the shell, then `up -d --build`
#
# Nothing here binds a port the tariff product uses (3000, 5432, 5433, 8000). The MVP's project
# (ekbill) is stopped and its volume ekbill_pgdata is kept; v2's volume is ekbill2_pgdata. Postgres
# and the app listen on 127.0.0.1 only; Docling is reachable only inside this stack; Caddy is the
# one public face, on 80/443, with automatic HTTPS and a shared password in front while sign-in is
# switched off (AUTH_MODE=switcher).

name: ekbill2

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekbill
      POSTGRES_DB: ekbill
      POSTGRES_PASSWORD: ${EKBILL_DB_PASSWORD:?run deploy/vm/up.sh, which reads it from Secret Manager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5441:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ekbill -d ekbill']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  docling:
    image: ${DOCLING_IMAGE:-quay.io/docling-project/docling-serve-cpu:v1.35.0}
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: 'false'
      DOCLING_SERVE_MAX_SYNC_WAIT: '300'
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: '1'
      OMP_NUM_THREADS: '2'
    # Keep it from starving the other products on the same 4 vCPUs.
    cpus: 2
    mem_limit: 6g
    expose:
      - '5001'

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ekbill2-app:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ekbill:${EKBILL_DB_PASSWORD}@db:5432/ekbill
      DOCLING_URL: http://docling:5001
      AUTH_MODE: ${AUTH_MODE:-switcher}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-not-a-secret-while-sign-in-is-off}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-}
      OPENAI_TEXT_PRICE_IN: ${OPENAI_TEXT_PRICE_IN:-}
      OPENAI_TEXT_PRICE_OUT: ${OPENAI_TEXT_PRICE_OUT:-}
      OPENAI_EMBED_PRICE_IN: ${OPENAI_EMBED_PRICE_IN:-}
      # Stage 10: the web process's share of Postgres's connections, and the rate limits (4.3).
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      RATE_WRITES_PER_MIN: ${RATE_WRITES_PER_MIN:-60}
      RATE_SIGNIN_PER_MIN: ${RATE_SIGNIN_PER_MIN:-30}
      BACKUP_STATE_FILE: /app/state/last-backup.json
    volumes:
      - ./vm/state:/app/state:ro
    ports:
      - '127.0.0.1:8080:3000'
    shm_size: 512mb

  worker:
    image: ekbill2-app:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    # The db package guards itself with server-only; the worker is server code, so it runs with React's server condition.
    command: ['node_modules/.bin/tsx', '--conditions=react-server', 'apps/worker/src/index.ts']
    # The image's health check probes the web port; the worker has none. Its own probe: the alive file is under 90 s old.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s=require('fs').statSync('/tmp/ekbill-worker-alive');process.exit(Date.now()-s.mtimeMs<90000?0:1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      DATABASE_URL: postgres://ekbill:${EKBILL_DB_PASSWORD}@db:5432/ekbill
      DOCLING_URL: http://docling:5001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-}
      OPENAI_VISION_PRICE_IN: ${OPENAI_VISION_PRICE_IN:-}
      OPENAI_VISION_PRICE_OUT: ${OPENAI_VISION_PRICE_OUT:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-}
      OPENAI_EMBED_PRICE_IN: ${OPENAI_EMBED_PRICE_IN:-}
      DB_POOL_MAX: ${DB_POOL_MAX_WORKER:-5}
      LOG_LEVEL: info

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      EKBILL_DOMAIN: ${EKBILL_DOMAIN:?run deploy/vm/up.sh, which works it out}
      EKBILL_ACME_EMAIL: ${EKBILL_ACME_EMAIL:-venture@aayuda.energy}
      EKBILL_GATE_USER: ${EKBILL_GATE_USER:-ekbill}
      # "off" when the gate is off; the hash of the gate password when it is on (deploy/vm/up.sh).
      EKBILL_GATE_HASH: ${EKBILL_GATE_HASH:-off}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/gate-${EKBILL_GATE_MODE:-off}.caddy:/etc/caddy/gate.caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
